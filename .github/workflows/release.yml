name: Release

# Actions → Release → Run workflow. Type a version (e.g. 0.3.0); this builds the
# APK and publishes it as a GitHub release tagged v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 0.3.0'
        required: true
      notes:
        description: 'What changed (optional; GitHub also lists the commits)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Every release must be signed with the same key, or phones refuse to
      # install it over the previous version. The key is the
      # ANDROID_DEBUG_KEYSTORE secret (base64), used as Flutter's signing key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_DEBUG_KEYSTORE secret first (see README → Making a release)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Generate Android scaffolding
        run: flutter create --org com.ollie --project-name mtg_dark_scanner --platforms android .

      - run: flutter pub get

      - name: Unit tests
        run: flutter test

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SHOWCASE_URL: ${{ secrets.SHOWCASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SHOWCASE_URL="$SHOWCASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "binderbound-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" "binderbound-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Binderbound $VERSION" \
            --notes "${NOTES:-Android APK below. Open it on your phone to install or update.}" \
            --generate-notes
