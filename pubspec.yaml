name: mtg_dark_scanner
description: MTG collection app with a dark-card scanner, binders, decks, friends and trade suggestions.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  file_selector: ^1.0.3
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
