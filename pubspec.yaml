name: mtg_dark_scanner
description: MTG card scanner tuned for black-bordered and black-frame cards on dark playmats.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
